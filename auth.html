{% extends "base.html" %}{% block body %}<div class="box" style="max-width:380px;margin:auto"><h2>{{ t(mode) }}</h2>
<form method="post">{% if mode=='register' %}<label>{{ t('name') }}</label><input name="name" required>{% endif %}
