{% extends "base.html" %}{% block body %}<div class="box"><h2>{{ t('report') }}</h2>
<form method="post" enctype="multipart/form-data">
<select name="type"><option value="lost">{{ t('lost') }}</option><option value="found">{{ t('found') }}</option></select>
<label>{{ t('name') }}</label><input name="name" required maxlength="60">
<label>{{ t('cat') }}</label><select name="category">{% for x in cats %}<option>{{ x }}</option>{% endfor %}</select>
<label>{{ t('place') }}</label><input name="place" required maxlength="60">
<p>{{ t('pin') }}</p><div id="map"></div><input type="hidden" name="lat" id="lat"><input type="hidden" name="lng" id="lng">
<label>{{ t('date') }}</label><input type="date" name="item_date" value="{{ today }}">
<label>{{ t('desc') }}</label><textarea name="description" rows="3" maxlength="200"></textarea>
<label>{{ t('photo') }}</label><input type="file" name="photo" accept="image/*"><button>{{ t('save') }}</button></form></div>{% endblock %}
{% block js %}<script>
const m=L.map('map').setView([30.37,76.78],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(m);
let pin;m.on('click',e=>{if(pin)pin.remove();pin=L.marker(e.latlng).addTo(m);lat.value=e.latlng.lat;lng.value=e.latlng.lng});
</script>{% endblock %}
